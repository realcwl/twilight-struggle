<!doctype html>
<html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>冷战热斗 · 卡牌审阅室</title><link rel="stylesheet" href="/prototypes/card-designs/final/styles.css"></head>
<body>
<header class="topbar"><a href="/" class="brand"><span class="compass">✦</span><span>冷战热斗<small>冷战 · 1945—1989</small></span></a><div class="top-right"><span class="local-dot"></span><span>本地审阅</span><a href="/review/pending.md" target="_blank">导出待办 ↗</a></div></header>
<main><section class="intro"><div><p class="eyebrow">豪华版 / 卡牌原型 · V2</p><h1>卡牌审阅室<span>110 张牌，一段冷战。</span></h1><p class="intro-copy">点开卡牌查看细节，在牌面上标注想修改的位置。评论可以粘贴、拖入或上传图片。<span class="term-legend"><small>五类语义高亮 · 悬停术语查看游戏画面演示</small></span></p></div><button id="pending-toggle" class="review-counter"><strong id="pending-count">0</strong><span>待处理评论 <b>↗</b></span></button></section>
<section class="toolbar" aria-label="卡牌筛选"><div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="搜索牌名、编号、规则…" aria-label="搜索卡牌"><kbd>/</kbd></div><div class="era-tabs" role="group" aria-label="时期"><button data-era="all" class="active">全部 <span>110</span></button><button data-era="early">早期 <span>39</span></button><button data-era="mid">中期 <span>48</span></button><button data-era="late">晚期 <span>23</span></button></div><select id="side-filter" aria-label="阵营"><option value="all">所有阵营</option><option value="us">美国事件</option><option value="ussr">苏联事件</option><option value="neutral">中立／特殊牌</option><option value="scoring">计分牌</option></select><select id="set-filter" aria-label="牌组"><option value="all">基础 + 可选</option><option value="base">基础牌 · 103</option><option value="optional">可选牌 · 7</option></select></section>
<div class="results-line"><span id="art-progress"></span><span id="result-count">正在加载卡牌…</span><div><label><input id="back-toggle" type="checkbox"> 查看统一背面</label><button id="reset-filters">重置筛选</button></div></div>
<section id="gallery" class="gallery" aria-label="卡牌列表"></section><p id="empty" class="empty" hidden>没有符合条件的卡牌。<button id="empty-reset">清除筛选</button></p>
<footer><span>103 张基础牌 + 7 张官方可选牌 · 编号与规则按经典豪华版核对</span><a href="/prototypes/card-designs/final/SOURCES.md" target="_blank">规则来源与制作记录 ↗</a></footer></main>
<dialog id="viewer" aria-label="卡牌详情与评论"><div class="viewer-bar"><div><span id="card-number"></span><strong id="card-name-zh"></strong><span id="card-set"></span></div><div class="viewer-controls"><button id="prev" aria-label="上一张">←</button><span id="position"></span><button id="next" aria-label="下一张">→</button><button id="close-viewer" aria-label="关闭详情">✕</button></div></div><div class="viewer-body"><section class="card-stage"><div class="stage-tools"><button id="flip-card">查看背面 ↻</button><button id="pin-mode" aria-pressed="false">＋ 标注位置</button><a id="export-card" target="_blank">独立预览 ↗</a></div><div id="large-card" class="large-card"></div><p id="stage-hint">点击「标注位置」，然后点击牌面添加评论。</p><div id="card-facts" class="card-facts"></div></section><aside class="review-panel"><div class="review-heading"><h2>评论 <span id="card-comment-count">0</span></h2><label><input type="checkbox" id="show-resolved"> 显示已处理</label></div><div id="comments" class="comments"></div><form id="comment-form"><div class="draft-anchor"><span id="anchor-label">整张卡牌</span><button id="clear-anchor" type="button" hidden>清除定位 ×</button></div><label class="sr-only" for="comment-text">评论内容</label><textarea id="comment-text" rows="4" placeholder="描述你想调整的地方…&#10;可直接粘贴图片，也可以拖到这里。"></textarea><div id="attachment-previews"></div><div class="form-actions"><label class="upload-label" for="image-input" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('image-input').click()}">＋ 添加图片</label><input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><button id="submit-comment" type="submit">保存评论 <span>↗</span></button></div><p id="save-state" role="status">保存后可在下一轮直接说「帮我 address」。</p></form><p class="review-storage">评论及附件保存在本地项目，刷新页面仍会保留。</p></aside></div></dialog>
<dialog id="image-lightbox"><button id="close-lightbox" aria-label="关闭图片">✕</button><img alt="评论图片"></dialog><div id="toast" role="status"></div>
<script type="module" src="/prototypes/card-designs/final/app.js"></script></body></html>
